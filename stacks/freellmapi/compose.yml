services:
  freellmapi:
    image: ghcr.io/tashfeenahmed/freellmapi:v0.14.2
    env_file:
      - ${FREELLMAPI_ENV_FILE:?ENV-Datei im User-Workspace erforderlich}
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
    ports:
      - "127.0.0.1:${FREELLMAPI_HOST_PORT:-3011}:3001"
    volumes:
      - ${FREELLMAPI_DATA_DIR:?Datenpfad im User-Workspace erforderlich}:/app/server/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/ping').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
