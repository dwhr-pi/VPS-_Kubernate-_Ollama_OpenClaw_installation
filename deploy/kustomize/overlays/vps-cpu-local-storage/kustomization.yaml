apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Fresh installs only: do not mutate an existing volumeClaimTemplate/StorageClass.
resources:
  - ../vps-cpu
patches:
  - target: {kind: StatefulSet, name: ollama}
    patch: |-
      - op: add
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: local-path
