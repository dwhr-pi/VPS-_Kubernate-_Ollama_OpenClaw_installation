# Oeffentlichen age-Empfaenger ersetzen; ohne Konfiguration wird abgebrochen.
# Private Identitaet ausserhalb von Git und normalen State-Backups halten.
creation_rules:
  - path_regex: '(^|/)core\.env\.enc\.json$'
    age: age1REPLACE_WITH_YOUR_PUBLIC_RECIPIENT
  - path_regex: '(^|/)secrets\.enc\.ya?ml$'
    encrypted_regex: '^(data|stringData)$'
    age: age1REPLACE_WITH_YOUR_PUBLIC_RECIPIENT
