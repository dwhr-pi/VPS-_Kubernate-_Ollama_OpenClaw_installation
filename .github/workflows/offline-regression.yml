name: Offline Regression

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
      GIT_TERMINAL_PROMPT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Static repository checks (no installers or services)
        run: python -B scripts/quality/repository_audit.py
      - name: Generated registry views must match source
        run: python -B scripts/quality/registry_catalog.py --check
      - name: Conservative tool truth table must match source
        run: python -I -B scripts/quality/tool_truth_table.py --check
      - name: Static audit evidence must match tracked source
        run: python -I -B scripts/quality/evidence_inventory.py --check
      - name: Headless command catalog must match reviewed registry metadata
        run: python -I -B scripts/tool_commands.py docs
      - name: Every registered tool must have a specific current VPS SSH guide
        run: python -I -B scripts/quality/tool_ssh_docs.py
      - name: Offline Python fixture regressions
        run: python -B -m unittest discover -s tests -p 'test_*.py' -v
