name: Desktop inventory - offline boundaries

on:
  pull_request:
    paths:
      - scripts/desktop/**
      - config/desktop_app_hints.json
      - config/schemas/app-discovery.schema.json
      - tests/test_app_inventory.py
      - .github/workflows/desktop-inventory.yml
  push:
    paths:
      - scripts/desktop/**
      - config/desktop_app_hints.json
      - config/schemas/app-discovery.schema.json
      - tests/test_app_inventory.py
      - .github/workflows/desktop-inventory.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixtures:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Synthetic metadata only, never scan installed runner applications
        run: python -B -m unittest discover -s tests -p test_app_inventory.py -v
