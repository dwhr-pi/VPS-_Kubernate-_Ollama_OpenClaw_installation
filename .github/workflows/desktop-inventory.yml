name: Desktop inventory - offline boundaries

on:
  pull_request:
    paths:
      - scripts/desktop/**
      - config/desktop_app_hints.json
      - config/schemas/app-discovery.schema.json
      - tests/test_app_inventory.py
      - .github/workflows/desktop-inventory.yml
  push:
    paths:
      - scripts/desktop/**
      - config/desktop_app_hints.json
      - config/schemas/app-discovery.schema.json
      - tests/test_app_inventory.py
      - .github/workflows/desktop-inventory.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixtures:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Synthetic metadata only, never scan installed runner applications
        run: python -B -m unittest discover -s tests -p test_app_inventory.py -v
