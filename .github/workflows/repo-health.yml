name: Repo Health

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repo-health:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install QA tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck shfmt python3
          npm install -g markdown-link-check@3.15.0

      - name: Validate JSON-compatible config
        run: bash scripts/validate_config.sh

      - name: Registry sync
        run: bash scripts/check_profile_registry_sync.sh

      - name: Shell syntax
        run: |
          find scripts -name '*.sh' -print0 | xargs -0 -n 1 bash -n
          bash -n install.sh
          bash -n setup_ultimate.sh

      - name: ShellCheck
        run: |
          find scripts -name '*.sh' -print0 | xargs -0 shellcheck -x
          shellcheck -x install.sh setup_ultimate.sh

      - name: shfmt check
        run: |
          shfmt -d -i 2 -ci scripts install.sh setup_ultimate.sh

      - name: Secret scan with Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Markdown link check
        run: |
          set -euo pipefail
          export NODE_PATH="$(npm root -g)"
          node --test tests/test_markdown_link_retry.cjs
          node scripts/quality/link_checker_contract.cjs "$(command -v markdown-link-check)"
          node scripts/quality/check_markdown_links.cjs -c .github/markdown-link-check.json readme.md
          find docs -name '*.md' -print0 | xargs -0 -r node scripts/quality/check_markdown_links.cjs -c .github/markdown-link-check.json
