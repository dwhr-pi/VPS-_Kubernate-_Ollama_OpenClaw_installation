name: Repo Health

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repo-health:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install QA tools
        run: |
          bash scripts/ci/install_qa_tools.sh

      - name: Validate JSON-compatible config
        run: bash scripts/validate_config.sh

      - name: Registry sync
        run: bash scripts/check_profile_registry_sync.sh

      - name: Shell syntax
        run: |
          find scripts -name '*.sh' -print0 | xargs -0 -n 1 bash -n
          bash -n install.sh
          bash -n setup_ultimate.sh

      - name: ShellCheck
        run: |
          find scripts -name '*.sh' -print0 | xargs -0 shellcheck -x
          shellcheck -x install.sh setup_ultimate.sh

      - name: shfmt check
        run: |
          shfmt -d -i 2 -ci scripts install.sh setup_ultimate.sh

      - name: Secret scan with Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
