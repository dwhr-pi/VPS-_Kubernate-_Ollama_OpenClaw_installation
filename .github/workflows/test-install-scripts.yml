name: Install scripts and production baseline
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: install-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Get pinned Bats from its official GitHub repository
        shell: bash
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/bats"
          git -C "$RUNNER_TEMP/bats" remote add origin https://github.com/bats-core/bats-core.git
          git -C "$RUNNER_TEMP/bats" fetch --depth=1 origin b640ec3cf2c7c9cfc9e6351479261186f76eeec8
          git -C "$RUNNER_TEMP/bats" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/bats" rev-parse HEAD)" = b640ec3cf2c7c9cfc9e6351479261186f76eeec8
      - name: Parse and exercise the real scripts in isolated fixtures
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tests/test_signed_release.py -v
          python3 -B tests/test_install_branches.py -v
          python3 -B tests/test_docs_navigation.py -v
          python3 -B tests/test_repository_audit.py -v
          python3 -B tests/test_ci_repair_contracts.py -v
          python3 -B tests/test_doc_assertions.py -v
          python3 -B tests/test_formatting_policy.py -v
          python3 -B tests/test_gitleaks_false_positives.py -v
          python3 -B tests/test_legacy_k8s_archive.py -v
          bash -n scripts/backup_stateful_services.sh
          "$RUNNER_TEMP/bats/bin/bats" tests/bats/install_scripts.bats
          python3 -B -m unittest discover -s tests -p test_production_baseline.py -v
          python3 -B -m unittest discover -s tests -p test_gpu_platform_blueprint.py -v
          bash -n scripts/monitoring_install.sh scripts/nvidia_device_plugin_install.sh scripts/seal_gemini_secret.sh
          python3 -B -m unittest discover -s tests -p test_vps_delivery.py -v
          python3 -B -m unittest discover -s tests -p test_vps_secrets.py -v
          python3 -B tests/test_archivebox_python.py -v
          python3 -B tests/test_native_uv.py -v
          python3 -B tests/test_native_build_deps.py -v
          python3 -B tests/test_litellm_rust.py -v
          python3 -B tests/test_native_node_npm.py -v
          python3 -B tests/test_native_build_process.py -v
          python3 -B tests/test_install_rollback.py -v
          python3 -B tests/test_installation_reset.py -v
          python3 -B tests/test_installation_inventory.py -v
          python3 -B tests/test_credentials_backup.py -v
          python3 -B tests/test_browser_research_tools.py -v
          python3 -B tests/test_browser_use_uv.py -v
          python3 -B tests/test_perplexity_mcp_node.py -v
          python3 -B tests/test_perplexity_sdk_tools.py -v
          python3 -B tests/test_gap_runtime_cleanup.py -v
          python3 -B tests/test_browseros_study.py -v
          python3 -B tests/test_enki_browser_study.py -v
          python3 -B tests/test_qwen_desktop_study.py -v
          python3 -B tests/test_litellm_rust_bootstrap.py -v
          python3 -B tests/test_litellm_build_timeout.py -v
          python3 -B tests/test_tool_menu_order.py -v
          bash -n scripts/credentials_backup_menu.sh
          bash -n scripts/installation_inventory_menu.sh
          bash -n scripts/operations/backup_run.sh
          bash -n scripts/auto_update_hard.sh
          bash -n scripts/installation_reset_menu.sh
          python3 -B tests/test_security_audit_docs.py -v
          node --test tests/resource_planner.test.cjs
          bash -n scripts/operations/deploy_vps_baseline.sh
      - name: Render Kubernetes objects without accessing a cluster
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --proto '=https' --proto-redir '=https' \
            https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.8.3/kustomize_v5.8.3_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/kustomize.tar.gz"
          printf '%s  %s\n' cb9e31198d3f63b44848bd0afc4c8efc56e6cfef9c93a4a39a211940e6decd61 \
            "$RUNNER_TEMP/kustomize.tar.gz" | sha256sum --check --strict -
          tar -xzf "$RUNNER_TEMP/kustomize.tar.gz" -C "$RUNNER_TEMP" kustomize
          "$RUNNER_TEMP/kustomize" build k8s/base > "$RUNNER_TEMP/llmops-base.yml"
          "$RUNNER_TEMP/kustomize" build k8s/overlays/production > "$RUNNER_TEMP/llmops-production.yml"
          "$RUNNER_TEMP/kustomize" build k8s/overlays/gpu > "$RUNNER_TEMP/llmops-gpu.yml"
          "$RUNNER_TEMP/kustomize" build k8s/overlays/vps-cpu > "$RUNNER_TEMP/llmops-vps.yml"
  secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Inspect repository files for secrets
        uses: aquasecurity/trivy-action@8f28faec26515256b6d22074d1d2a8986f4cbd87
        with:
          version: v0.76.1
          scan-type: fs
          scan-ref: .
          scanners: secret
          # Report locations and rule IDs only, never matching secret content.
          format: template
          template: '{{ range . }}{{ $target := .Target }}{{ range .Secrets }}{{ printf "%s: %s\n" $target .RuleID }}{{ end }}{{ end }}'
          exit-code: '1'
          hide-progress: 'true'
          cache: 'false'
  configuration-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Reject high and critical infrastructure misconfigurations
        uses: aquasecurity/trivy-action@8f28faec26515256b6d22074d1d2a8986f4cbd87
        with:
          version: v0.76.1
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'
          hide-progress: 'true'
          cache: 'false'
