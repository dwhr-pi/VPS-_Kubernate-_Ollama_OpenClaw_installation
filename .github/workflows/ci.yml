name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repo-health:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install check tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck shfmt
          npm install -g markdownlint-cli@0.44.0 markdown-link-check@3.15.0

      - name: Bash syntax
        run: |
          bash -n install.sh
          bash -n setup_ultimate.sh
          find scripts -name '*.sh' -print0 | xargs -0 -n1 bash -n

      - name: ShellCheck
        run: |
          find scripts -name '*.sh' -print0 | xargs -0 shellcheck

      - name: shfmt check
        run: |
          find scripts -name '*.sh' -print0 | xargs -0 shfmt -d -i 2 -ci

      - name: Markdownlint
        run: |
          markdownlint readme.md docs/**/*.md

      - name: Markdown links
        run: |
          node scripts/quality/link_checker_contract.cjs "$(command -v markdown-link-check)"
          markdown-link-check -c .github/markdown-link-check.json readme.md

      - name: Secret scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Config validation
        run: |
          bash scripts/validate_config.sh

      - name: Registry sync
        run: |
          bash scripts/check_profile_registry_sync.sh

      - name: Matrix checks
        run: |
          bash scripts/profile_matrix_check.sh
          bash scripts/tool_registry_check.sh

      - name: Tool lifecycle audit
        run: |
          bash scripts/check_tool_lifecycle.sh

      - name: Security scan wrappers
        run: |
          bash scripts/secret_scan.sh
          bash scripts/security_scan.sh

      - name: Setup dry-run safety
        run: |
          bash scripts/next_level_dry_run_check.sh
