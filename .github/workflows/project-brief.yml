name: Project brief and public key import - offline boundaries

on:
  pull_request:
    paths:
      - scripts/projects/**
      - scripts/security/import_release_public_key.py
      - tests/test_project_brief.py
      - tests/test_public_key_import.py
      - .github/workflows/project-brief.yml
  push:
    paths:
      - scripts/projects/**
      - scripts/security/import_release_public_key.py
      - tests/test_project_brief.py
      - tests/test_public_key_import.py
      - .github/workflows/project-brief.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixtures:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Synthetic projects and public-format bytes only
        run: |
          python -B -m unittest discover -s tests -p test_project_brief.py -v
          python -B -m unittest discover -s tests -p test_public_key_import.py -v
