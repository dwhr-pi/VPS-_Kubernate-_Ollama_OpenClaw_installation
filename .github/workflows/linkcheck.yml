name: markdown-link-check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linkcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned link checker
        run: npm install -g markdown-link-check@3.15.0
      - name: Verify fail-closed behavior without network
        run: |
          export NODE_PATH="$(npm root -g)"
          node --test tests/test_markdown_link_retry.cjs
          node scripts/quality/link_checker_contract.cjs "$(command -v markdown-link-check)"
      - name: Check all Markdown files
        run: |
          set -euo pipefail
          export NODE_PATH="$(npm root -g)"
          find . -type f -name '*.md' -not -path './node_modules/*' -not -path './.git/*' -print0 \
            | xargs -0 -r node scripts/quality/check_markdown_links.cjs -c .github/markdown-link-check.json
