name: markdown-link-check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linkcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned link checker
        run: npm install -g markdown-link-check@3.15.0
      - name: Verify fail-closed behavior without network
        run: node scripts/quality/link_checker_contract.cjs "$(command -v markdown-link-check)"
      - name: Check all Markdown files
        run: |
          find . -type f -name '*.md' -not -path './node_modules/*' -not -path './.git/*' -print0 \
            | xargs -0 -r markdown-link-check -c .github/markdown-link-check.json
