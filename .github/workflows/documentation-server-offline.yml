name: Documentation server - offline boundaries
on:
  pull_request:
    paths:
      - scripts/documentation_server/**
      - scripts/markdown_docs_server_menu.sh
      - scripts/tools/markdown_docs_server_*.sh
      - tests/test_documentation_server.py
      - tests/test_markdown_docs_settings.py
      - .github/workflows/documentation-server-offline.yml
  push:
    branches: [main]
    paths:
      - scripts/documentation_server/**
      - scripts/markdown_docs_server_menu.sh
      - scripts/tools/markdown_docs_server_*.sh
      - tests/test_documentation_server.py
      - tests/test_markdown_docs_settings.py
      - .github/workflows/documentation-server-offline.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixtures:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Local HTTP and source lifecycle fixtures, no downloads or installation
        run: python -B -m unittest discover -s tests -p test_documentation_server.py -v
      - name: Settings fixtures with fake dialog and Python, no installed app
        run: python -B -m unittest discover -s tests -p test_markdown_docs_settings.py -v
