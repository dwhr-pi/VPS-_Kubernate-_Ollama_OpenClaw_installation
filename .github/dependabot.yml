version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
  - package-ecosystem: npm
    directory: /tools/websitefactory
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels:
      - dependencies
