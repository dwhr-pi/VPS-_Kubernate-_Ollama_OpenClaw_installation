global:
  scrape_interval: 30s
  scrape_timeout: 10s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
  - job_name: litellm
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/litellm-metrics-token
    static_configs:
      # Must be a reachable private listener, not a host-only loopback binding.
      - targets: ['REPLACE_PRIVATE_LITELLM_ADDRESS:4000']
  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']
  - job_name: ollama-exporter
    metrics_path: /metrics
    # Read-only-Inventarexporter, keine Inferenztests und keine erfundenen GPU-Metriken.
    # Ziele erst nach bewusster Abnahme aktivieren; Beispiel liegt daneben.
    sample_limit: 128
    file_sd_configs:
      - files: [/etc/prometheus/ollama-metrics.targets.json]
        refresh_interval: 60s
