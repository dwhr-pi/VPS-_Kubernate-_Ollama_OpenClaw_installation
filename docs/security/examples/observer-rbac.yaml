# Review only; not included in any deployment overlay.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: llmops-status-reader
  namespace: llmops
rules:
  - apiGroups: ['']
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, replicasets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: llmops-status-readers
  namespace: llmops
subjects:
  - kind: Group
    name: llmops-observers
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: llmops-status-reader
  apiGroup: rbac.authorization.k8s.io
