# Requires the opt-in metrics-isolation overlay and reviewed Operator CRDs.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: litellm
  namespace: llmops
  labels: {release: llmops-monitoring}
spec:
  namespaceSelector: {matchNames: [llmops]}
  selector:
    matchLabels: {llmops-metrics: litellm}
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
      # Secret liegt im Namespace dieses ServiceMonitor, nicht im Git.
      authorization:
        type: Bearer
        credentials: {name: litellm-metrics-scrape, key: token}
