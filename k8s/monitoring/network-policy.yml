apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: loki-monitoring-only
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: loki
      app.kubernetes.io/instance: llmops-loki
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: monitoring}
      ports:
        - {protocol: TCP, port: 3100}
        - {protocol: TCP, port: 9095}
        - {protocol: TCP, port: 7946}
        - {protocol: UDP, port: 7946}
