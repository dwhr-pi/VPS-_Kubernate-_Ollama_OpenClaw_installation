apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ollama
  namespace: llmops
spec:
  template:
    spec:
      # Keep these invariants identical to the base, including in raw patch scans.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      nodeSelector:
        llmops.example/gpu: 'true'
      containers:
        - name: ollama
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests:
              cpu: '2'
              memory: 8Gi
              ephemeral-storage: 512Mi
              nvidia.com/gpu: 1
            limits:
              cpu: '8'
              memory: 16Gi
              ephemeral-storage: 4Gi
              nvidia.com/gpu: 1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: llmops
spec:
  template:
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: litellm
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 500m, memory: 1Gi, ephemeral-storage: 256Mi}
            limits: {cpu: '2', memory: 4Gi, ephemeral-storage: 1Gi}
