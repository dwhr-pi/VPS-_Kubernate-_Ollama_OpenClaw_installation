apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ollama
  namespace: llmops
spec:
  template:
    spec:
      nodeSelector:
        llmops.example/gpu: 'true'
      containers:
        - name: ollama
          resources:
            requests:
              cpu: '2'
              memory: 8Gi
              ephemeral-storage: 512Mi
              nvidia.com/gpu: 1
            limits:
              cpu: '8'
              memory: 16Gi
              ephemeral-storage: 4Gi
              nvidia.com/gpu: 1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: llmops
spec:
  template:
    spec:
      containers:
        - name: litellm
          resources:
            requests: {cpu: 500m, memory: 1Gi, ephemeral-storage: 256Mi}
            limits: {cpu: '2', memory: 4Gi, ephemeral-storage: 1Gi}
