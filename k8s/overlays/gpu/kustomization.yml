apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: llmops
resources:
  - ../../base
  - agent-workspace-pvc.yml
  - ingress-network-policy.yml
patches:
  - target: {kind: Service, name: litellm}
    patch: |-
      - op: add
        path: /metadata/labels
        value: {llmops-metrics: litellm}
  - path: k8s-ollama-deployment.yaml
  - path: gateway-patch.yml
  - target: {kind: ResourceQuota, name: llmops-budget}
    patch: |-
      - op: add
        path: /spec/hard/requests.nvidia.com~1gpu
        value: '1'
