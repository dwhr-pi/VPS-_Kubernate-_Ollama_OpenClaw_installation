apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ollama
  namespace: llmops
spec:
  template:
    spec:
      containers:
        - name: ollama
          env:
            - {name: OLLAMA_CONTEXT_LENGTH, value: '2048'}
            - {name: OLLAMA_MAX_QUEUE, value: '4'}
            - {name: OLLAMA_KEEP_ALIVE, value: 5m}
          resources:
            requests: {cpu: '1', memory: 2Gi, ephemeral-storage: 256Mi}
            limits: {cpu: '2', memory: 4Gi, ephemeral-storage: 2Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: llmops
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: litellm
          resources:
            requests: {cpu: 250m, memory: 256Mi, ephemeral-storage: 128Mi}
            limits: {cpu: '1', memory: 1Gi, ephemeral-storage: 512Mi}
