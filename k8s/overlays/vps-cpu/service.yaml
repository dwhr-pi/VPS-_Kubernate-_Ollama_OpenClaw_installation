# ClusterIP services come from base. This grants only selected agent clients.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-clients-to-litellm
  namespace: llmops
spec:
  podSelector:
    matchLabels: {app: litellm}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {llmops-client: 'true'}
          podSelector:
            matchLabels: {llmops-gateway-client: 'true'}
      ports:
        - {protocol: TCP, port: 4000}
