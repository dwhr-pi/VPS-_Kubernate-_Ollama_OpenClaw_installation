apiVersion: v1
kind: LimitRange
metadata:
  name: argocd-core-defaults
spec:
  limits:
    - type: Container
      defaultRequest: {cpu: 50m, memory: 128Mi, ephemeral-storage: 64Mi}
      default: {cpu: 500m, memory: 512Mi, ephemeral-storage: 512Mi}
      max: {cpu: '1', memory: 1Gi, ephemeral-storage: 1Gi}
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: argocd-core-budget
spec:
  hard:
    requests.cpu: '1'
    limits.cpu: '3'
    requests.memory: 1Gi
    limits.memory: 3Gi
    pods: '6'
    services.loadbalancers: '0'
    services.nodeports: '0'
