# Merge intentionally into your project's existing configuration.
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
check_untyped_defs = true

# Alternative formatter, not an additional formatter after Black.
[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
