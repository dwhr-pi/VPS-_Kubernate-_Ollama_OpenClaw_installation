# ESO does NOT decrypt SOPS from Git. The provider contains the decrypted value.
# Separate prerequisites: ESO v1 CRDs, an existing TLS OpenBao/Vault-compatible
# service, trusted CA, Kubernetes auth role limited to secret/data/llmops/litellm.
apiVersion: v1
kind: ServiceAccount
metadata: {name: eso-litellm-reader, namespace: llmops}
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata: {name: model-gateway-store, namespace: llmops}
spec:
  provider:
    vault:
      server: https://openbao.security.svc.cluster.local:8200
      path: secret
      version: v2
      caProvider:
        type: ConfigMap
        name: provider-ca
        key: ca.crt
      auth:
        kubernetes:
          mountPath: kubernetes
          role: eso-litellm-reader
          serviceAccountRef:
            name: eso-litellm-reader
            audiences: [openbao]
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: litellm-auth, namespace: llmops}
spec:
  refreshInterval: 1h
  secretStoreRef: {name: model-gateway-store, kind: SecretStore}
  target:
    name: litellm-auth
    creationPolicy: Owner
    deletionPolicy: Retain
    template: {type: Opaque}
  data:
    - secretKey: LITELLM_MASTER_KEY
      remoteRef:
        key: llmops/litellm
        property: LITELLM_MASTER_KEY
# Workload integration: secretKeyRef name=litellm-auth, key=LITELLM_MASTER_KEY.
# Ollama is not assumed to provide native bearer-token authentication.
# WireGuard private keys belong to the tunnel host, not every AI pod.
